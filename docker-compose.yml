version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: trybe-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-trybe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trybe_password}
      POSTGRES_DB: ${DB_NAME:-trybe}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trybe-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trybe}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for caching and background tasks)
  redis:
    image: redis:7-alpine
    container_name: trybe-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - trybe-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch (for search functionality)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: trybe-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - trybe-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trybe-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-trybe}:${DB_PASSWORD:-trybe_password}@postgres:5432/${DB_NAME:-trybe}
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_HOST=elasticsearch:9200
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - trybe-network
    restart: unless-stopped

  # Celery Worker (for background tasks) - Optional
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trybe-celery-worker
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-trybe}:${DB_PASSWORD:-trybe_password}@postgres:5432/${DB_NAME:-trybe}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    networks:
      - trybe-network
    restart: unless-stopped
    profiles:
      - with-celery

  # Celery Beat (for scheduled tasks) - Optional
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trybe-celery-beat
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-trybe}:${DB_PASSWORD:-trybe_password}@postgres:5432/${DB_NAME:-trybe}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    networks:
      - trybe-network
    restart: unless-stopped
    profiles:
      - with-celery

  # Nginx (reverse proxy) - Optional
  nginx:
    image: nginx:alpine
    container_name: trybe-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - trybe-network
    restart: unless-stopped
    profiles:
      - with-nginx

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  trybe-network:
    driver: bridge
