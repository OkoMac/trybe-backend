version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: trybe-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-trybe_db}
      POSTGRES_USER: ${DB_USER:-trybe_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trybe_password_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trybe_user} -d ${DB_NAME:-trybe_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trybe-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: trybe-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis_password_dev}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - trybe-network
    restart: unless-stopped

  # FastAPI Backend (Development)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: trybe-backend
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-trybe_user}:${DB_PASSWORD:-trybe_password_dev}@postgres:5432/${DB_NAME:-trybe_db}
      DB_ECHO: ${DB_ECHO:-false}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_dev}@redis:6379/0

      # JWT
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7

      # API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

      # Email
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

      # WhatsApp (Twilio)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-}

      # App Settings
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}

      # Sentry
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./tests:/app/tests
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trybe-network
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
      "

  # Celery Worker (Background Tasks)
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: trybe-celery-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-trybe_user}:${DB_PASSWORD:-trybe_password_dev}@postgres:5432/${DB_NAME:-trybe_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_dev}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ./app:/app/app
    depends_on:
      - postgres
      - redis
    networks:
      - trybe-network
    restart: unless-stopped
    command: celery -A app.core.celery worker --loglevel=info --concurrency=4

  # Celery Beat (Scheduled Tasks)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: trybe-celery-beat
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-trybe_user}:${DB_PASSWORD:-trybe_password_dev}@postgres:5432/${DB_NAME:-trybe_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_dev}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    volumes:
      - ./app:/app/app
    depends_on:
      - postgres
      - redis
    networks:
      - trybe-network
    restart: unless-stopped
    command: celery -A app.core.celery beat --loglevel=info

  # PgAdmin (Database Management - Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trybe-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@trybe.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - trybe-network
    restart: unless-stopped
    profiles:
      - tools

  # Redis Commander (Redis Management - Optional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: trybe-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-redis_password_dev}
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      - redis
    networks:
      - trybe-network
    restart: unless-stopped
    profiles:
      - tools

networks:
  trybe-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
